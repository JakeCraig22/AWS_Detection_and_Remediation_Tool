AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Capstone findings integration stack for EventBridge -> Lambda recorder.
  This models the GuardDuty and Macie findings intake path.

Parameters:
  ResultsBucketName:
    Type: String
    Default: ferpa-remediation-results-cap

  RecorderFunctionName:
    Type: String
    Default: capstone-finding-recorder

Resources:
  GuardDutyFindingsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: guardduty-findings-to-recorder
      Description: Sends GuardDuty findings to the recorder Lambda
      EventBusName: default
      EventPattern:
        source:
          - aws.guardduty
        detail-type:
          - GuardDuty Finding
      State: ENABLED
      Targets:
        - Id: GuardDutyRecorderTarget
          Arn: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${RecorderFunctionName}

  MacieFindingsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: macie-findings-to-recorder
      Description: Sends Macie findings to the recorder Lambda
      EventBusName: default
      EventPattern:
        source:
          - aws.macie
        detail-type:
          - Macie Finding
      State: ENABLED
      Targets:
        - Id: MacieRecorderTarget
          Arn: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${RecorderFunctionName}

  GuardDutyInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RecorderFunctionName
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt GuardDutyFindingsRule.Arn

  MacieInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RecorderFunctionName
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MacieFindingsRule.Arn

Outputs:
  GuardDutyRuleArn:
    Description: ARN of the GuardDuty EventBridge rule
    Value: !GetAtt GuardDutyFindingsRule.Arn

  MacieRuleArn:
    Description: ARN of the Macie EventBridge rule
    Value: !GetAtt MacieFindingsRule.Arn

  RecorderFunctionArn:
    Description: ARN of the findings recorder Lambda
    Value: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${RecorderFunctionName}

  ResultsBucket:
    Description: Results bucket used by the recorder
    Value: !Ref ResultsBucketName
